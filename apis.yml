name: Prescience Inc
description: >-
  Prescience, Inc. is a Y Combinator (Summer 2026) health benefits platform for
  employers, building "healthcare for the age of abundant intelligence." It uses
  machine-learning underwriting to design custom, largely self-insured health
  plans that aim to cut employer healthcare spend 20-50% versus traditional
  PEO and insurer plans, pairing $0-deductible coverage, included GLP-1
  medications, wearables, and a 24/7 AI Care Companion for members. The company
  sells to employers, private-equity portfolios, and providers, and publicly
  attests to SOC 2 and HIPAA compliance. As of this profile it exposes a
  marketing and member/employer web application only - no public API, developer
  portal, SDKs, MCP server, or machine-readable specification was found.
